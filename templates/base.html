{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flux | Cine Underground{% endblock %}</title>
    
    <!-- CSS Bootstrap Local -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-danger">
        <div class="container">
            <a class="navbar-brand" href="{% url 'principal:inicio' %}">
                <img src="{% static 'img/logo.png' %}" alt="FLUX" style="height: 40px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Enlaces a la App 1 -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'principal:inicio' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'principal:directores' %}">Directores</a>
                    </li>
                    <!-- Enlaces a la App 2 -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalogo:lista_peliculas' %}">Catálogo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de Página -->
    <footer class="bg-black text-center text-muted py-3 border-top border-secondary mt-auto">
        <div class="container">
            <p class="mb-0">Flux &copy; 2026 - Plataforma de Cine Experimental y de Culto.</p>
        </div>
    </footer>

    <!-- JS Bootstrap Local -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
