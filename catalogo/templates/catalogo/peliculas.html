{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Catálogo Cinematográfico</h2>
    <!-- Botón Agregar (Marcador de posición requerimiento Eva 2) -->
    <a href="#" class="btn btn-success">+ Agregar Película</a>
  </div>

  <!-- Formulario de Búsqueda -->
  <form method="GET" class="row g-2 mb-4">
    <div class="col-md-10">
      <input type="text" name="q" value="{{ request.GET.q }}" class="form-control" placeholder="Buscar por título, sinopsis o director...">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Buscar</button>
    </div>
  </form>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for pelicula in peliculas %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        <img src="{{ pelicula.poster_url }}" class="card-img-top" alt="{{ pelicula.title }}">
        <div class="card-body">
          <h5 class="card-title">{{ pelicula.title }} ({{ pelicula.year }})</h5>
          <p class="card-text text-muted">Dir: {{ pelicula.director.nombre }}</p>
          <span class="badge bg-secondary">{{ pelicula.format_type }}</span>
        </div>
        <!-- Botones Modificar / Eliminar (Marcadores de posición requerimiento Eva 2) -->
        <div class="card-footer bg-transparent d-flex justify-content-between">
          <a href="{% url 'detalle_pelicula' slug=pelicula.slug %}" class="btn btn-sm btn-info text-white">Ver Ficha</a>
          <div>
            <a href="#" class="btn btn-sm btn-outline-warning">Modificar</a>
            <a href="#" class="btn btn-sm btn-outline-danger">Eliminar</a>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
